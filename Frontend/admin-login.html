<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ECFA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
    </script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
    <nav class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-900/95 text-white shadow-xl backdrop-blur">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
            <a href="index.html" class="flex items-center gap-3 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/60">
                <span class="flex shrink-0 rounded-xl bg-white px-2.5 py-2 shadow-lg shadow-black/35 ring-2 ring-white">
                    <img src="logo.jpeg" alt="ECFA" class="h-10 w-auto object-contain sm:h-11 md:h-12 max-w-[280px] sm:max-w-[320px] md:max-w-[380px]" width="380" height="127" decoding="async">
                </span>
                <span class="text-lg font-extrabold tracking-tight text-amber-300">Admin</span>
            </a>
            <a href="index.html" class="text-sm font-medium text-slate-200 hover:text-amber-200">← Back to site</a>
        </div>
    </nav>

    <main class="flex min-h-[calc(100vh-4rem)] items-center justify-center bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 px-4 py-16">
        <div class="w-full max-w-md rounded-2xl border border-white/10 bg-white/95 p-8 shadow-2xl backdrop-blur">
            <h1 class="text-center text-2xl font-extrabold text-slate-900">Admin Login</h1>
            <p class="mt-1 text-center text-sm text-slate-500">East Champaran Fencing Association</p>

            <form id="loginForm" class="mt-8 space-y-5">
                <div>
                    <label for="email" class="block text-sm font-semibold text-slate-700">Email</label>
                    <input type="email" id="email" name="email" required placeholder="admin@ecfa.org" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                    <span class="error-message mt-1 block text-sm text-red-600" id="emailError"></span>
                </div>
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" class="mt-1 w-full rounded-xl border border-slate-300 px-4 py-3 shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                    <span class="error-message mt-1 block text-sm text-red-600" id="passwordError"></span>
                </div>
                <div id="alertBox" class="hidden rounded-xl border px-4 py-3 text-sm font-medium"></div>
                <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 py-3 font-semibold text-white shadow-lg transition hover:opacity-90">Sign in</button>
            </form>

            <p class="mt-6 text-center text-xs text-slate-500">
                Demo: <span class="font-mono text-slate-700">admin@ecfa.com</span> / <span class="font-mono text-slate-700">password</span>
            </p>
        </div>
    </main>

    <footer class="bg-slate-900 py-6 text-center text-xs text-slate-500">
        &copy; 2026 East Champaran Fencing Association
    </footer>

    <script src="js/api-client.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            function setAlert(msg, kind) {
                alertBox.textContent = msg;
                alertBox.classList.remove('hidden', 'border-emerald-200', 'bg-emerald-50', 'text-emerald-900', 'border-red-200', 'bg-red-50', 'text-red-900');
                if (kind === 'success') {
                    alertBox.classList.add('border-emerald-200', 'bg-emerald-50', 'text-emerald-900');
                } else {
                    alertBox.classList.add('border-red-200', 'bg-red-50', 'text-red-900');
                }
                alertBox.classList.remove('hidden');
            }

            try {
                document.querySelectorAll('#loginForm .error-message').forEach(el => { el.textContent = ''; });
                alertBox.classList.add('hidden');

                const response = await ApiClient.login(email, password);

                if (response.token) {
                    localStorage.setItem('ecfa_token', response.token);
                    if (response.user) {
                        localStorage.setItem('admin_user', JSON.stringify(response.user));
                    }
                    setAlert('✅ Login successful! Redirecting…', 'success');
                    setTimeout(() => { window.location.href = 'admin-dashboard.html'; }, 1000);
                } else {
                    throw new Error(response.message || 'Login failed');
                }
            } catch (error) {
                setAlert('❌ ' + (error.message || 'Login failed. Check your credentials.'), 'error');
            }
        });
    </script>
</body>
</html>
