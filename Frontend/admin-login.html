<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ECFA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">🤺 ECFA Admin</a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="hero-banner" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, var(--primary-color), #004d7a);">
        <div style="background: white; padding: 3rem; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);">
            <h2 style="text-align: center; color: var(--primary-color); margin-bottom: 2rem;">Admin Login</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email" style="font-weight: 600; color: var(--primary-color); display: block; margin-bottom: 0.5rem;">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="admin@ecfa.org" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; font-size: 1rem;">
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group" style="margin-top: 1.5rem;">
                    <label for="password" style="font-weight: 600; color: var(--primary-color); display: block; margin-bottom: 0.5rem;">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 4px; font-size: 1rem;">
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div id="alertBox" class="alert" style="margin-top: 1rem; display: none;"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 2rem; padding: 0.75rem;">Login</button>
            </form>

            <p style="text-align: center; margin-top: 1.5rem; color: #666;">
                Demo Credentials<br>
                <small>Email: admin@ecfa.com</small><br>
                <small>Password: password</small>
            </p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 East Champaran Fencing Association. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/api-client.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            try {
                // Clear previous errors
                document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
                alertBox.style.display = 'none';

                const response = await ApiClient.login(email, password);

                if (response.token) {
                    // Store token
                    localStorage.setItem('ecfa_token', response.token);
                    if (response.user) {
                        localStorage.setItem('admin_user', JSON.stringify(response.user));
                    }

                    // Show success
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = '✅ Login successful! Redirecting...';
                    alertBox.style.display = 'block';

                    // Redirect after 1 second
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1000);
                } else {
                    throw new Error(response.message || 'Login failed');
                }
            } catch (error) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = '❌ ' + (error.message || 'Login failed. Please check your credentials.');
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
