<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn - ECFA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };</script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
    <nav class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-900/95 text-white shadow-xl backdrop-blur">
        <div class="relative mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-4">
            <a href="index.html" class="flex shrink-0 items-center rounded-xl bg-white px-3 py-2.5 shadow-lg ring-2 ring-white">
                <img src="logo.jpeg" alt="ECFA" class="h-10 w-auto max-w-[280px] object-contain md:h-11" width="320" height="107" decoding="async">
            </a>
            <button type="button" id="ecfa-nav-toggle" class="rounded-lg bg-slate-800 p-2 md:hidden" aria-label="Menu">☰</button>
            <div id="ecfa-nav-panel" class="hidden w-full md:block md:w-auto">
                <ul class="flex flex-col gap-1 border-t border-slate-800 pt-4 text-sm font-medium md:flex-row md:items-center md:gap-5 md:border-0 md:pt-0">
                    <li><a href="index.html" class="block rounded-lg px-3 py-2 text-slate-100 hover:bg-slate-800 md:inline">Home</a></li>
                    <li><a href="learn.html" class="block rounded-lg px-3 py-2 text-amber-300 md:inline md:border-b-2 md:border-amber-300 md:pb-1">Learn</a></li>
                    <li><a href="player-login.html" class="block rounded-lg px-3 py-2 text-slate-100 hover:bg-slate-800 md:inline">Player Login</a></li>
                    <li class="md:ml-2"><button type="button" id="playerLogoutBtn" class="hidden rounded-lg border border-slate-600 px-4 py-2 text-sm font-semibold hover:bg-slate-800">Logout</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="border-b border-slate-200 bg-gradient-to-r from-blue-700 to-indigo-800 py-12 text-white">
        <div class="mx-auto max-w-6xl px-4">
            <h1 class="text-3xl font-extrabold md:text-4xl">Learn</h1>
            <p class="mt-2 max-w-2xl text-blue-100">Pick a weapon (Foil, Epee, Sabre), optionally filter by event, then view or download PDF notes uploaded by coaches.</p>
            <p id="playerWelcome" class="mt-4 hidden text-sm font-medium text-amber-200"></p>
        </div>
    </section>

    <main class="mx-auto max-w-6xl px-4 py-10">
        <div id="loginGate" class="hidden rounded-2xl border border-amber-200 bg-amber-50 p-8 text-center">
            <p class="text-slate-800">Please log in as a player to access learning materials.</p>
            <a href="player-login.html?redirect=learn.html" class="mt-4 inline-block rounded-full bg-blue-600 px-6 py-3 font-semibold text-white hover:bg-blue-500">Go to player login</a>
        </div>

        <div id="learnPanel" class="hidden space-y-8">
            <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
                <div>
                    <label class="block text-sm font-semibold text-slate-700">Filter by event</label>
                    <select id="eventFilter" class="mt-1 w-full max-w-md rounded-xl border border-slate-300 bg-white px-4 py-2.5 md:w-auto">
                        <option value="">All events</option>
                    </select>
                </div>
                <div class="flex flex-wrap gap-2" id="weaponTabs">
                    <button type="button" data-weapon="" class="weapon-tab rounded-full bg-blue-600 px-4 py-2 text-sm font-semibold text-white">All</button>
                    <button type="button" data-weapon="Foil" class="weapon-tab rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Foil</button>
                    <button type="button" data-weapon="Epee" class="weapon-tab rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Épée</button>
                    <button type="button" data-weapon="Sabre" class="weapon-tab rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50">Sabre</button>
                </div>
            </div>
            <div id="materials-container" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
        </div>
    </main>

    <script src="js/api-client.js"></script>
    <script src="js/script.js"></script>
    <script>
        let currentWeapon = '';

        function setWeaponTabs() {
            document.querySelectorAll('.weapon-tab').forEach(btn => {
                const w = btn.getAttribute('data-weapon');
                const on = w === currentWeapon;
                btn.className = on
                    ? 'weapon-tab rounded-full bg-blue-600 px-4 py-2 text-sm font-semibold text-white'
                    : 'weapon-tab rounded-full border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50';
            });
        }

        async function loadEvents() {
            try {
                const events = await ApiClient.getEvents();
                const sel = document.getElementById('eventFilter');
                const list = Array.isArray(events) ? events : [];
                list.forEach(ev => {
                    const o = document.createElement('option');
                    o.value = ev.id;
                    o.textContent = (ev.title || ev.name || 'Event') + (ev.event_date ? ' — ' + ev.event_date : '');
                    sel.appendChild(o);
                });
            } catch (e) { console.error(e); }
        }

        async function loadMaterials() {
            const container = document.getElementById('materials-container');
            container.innerHTML = '<p class="text-slate-500 col-span-full">Loading…</p>';
            const params = {};
            if (currentWeapon) params.weapon = currentWeapon;
            const eid = document.getElementById('eventFilter').value;
            if (eid) params.event_id = eid;
            try {
                const rows = await ApiClient.getLearnMaterials(params, true);
                const list = Array.isArray(rows) ? rows : [];
                if (list.length === 0) {
                    container.innerHTML = '<p class="text-slate-600 col-span-full rounded-xl border border-slate-200 bg-white p-8 text-center">No PDFs for this filter yet.</p>';
                    return;
                }
                container.innerHTML = list.map(m => {
                    const ev = m.event ? `<span class="text-xs text-slate-500">${m.event.title || ''}</span>` : '<span class="text-xs text-slate-400">General</span>';
                    const fname = (m.original_filename || 'document.pdf').replace(/"/g, '&quot;');
                    return `
                        <article class="flex flex-col rounded-2xl border border-slate-200 bg-white p-5 shadow-md">
                            <span class="inline-flex w-fit rounded-full bg-indigo-100 px-2 py-0.5 text-xs font-bold text-indigo-800">${m.weapon}</span>
                            <h3 class="mt-2 font-bold text-slate-900">${m.title}</h3>
                            <p class="mt-1 text-xs text-slate-500">${m.original_filename}</p>
                            <div class="mt-2">${ev}</div>
                            <button type="button" class="download-pdf-btn mt-auto pt-4 text-left text-sm font-semibold text-blue-600 hover:text-blue-500" data-id="${m.id}" data-filename="${fname}">Download PDF →</button>
                        </article>`;
                }).join('');
                container.querySelectorAll('.download-pdf-btn').forEach(b => {
                    b.addEventListener('click', () => downloadDoc(Number(b.dataset.id), b.dataset.filename));
                });
            } catch (e) {
                container.innerHTML = '<p class="text-red-600 col-span-full">' + (e.message || 'Failed to load') + '</p>';
            }
        }

        async function downloadDoc(id, name) {
            if (!name) name = 'document.pdf';
            try {
                await ApiClient.downloadLearnMaterial(id, name, true);
            } catch (e) {
                alert(e.message || 'Download failed');
            }
        }

        document.querySelectorAll('.weapon-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                currentWeapon = btn.getAttribute('data-weapon') || '';
                setWeaponTabs();
                loadMaterials();
            });
        });

        document.getElementById('eventFilter').addEventListener('change', loadMaterials);

        document.getElementById('playerLogoutBtn').addEventListener('click', async () => {
            await ApiClient.playerLogout();
            window.location.reload();
        });

        (async function init() {
            if (!ApiClient.getPlayerToken()) {
                document.getElementById('loginGate').classList.remove('hidden');
                return;
            }
            document.getElementById('learnPanel').classList.remove('hidden');
            document.getElementById('playerLogoutBtn').classList.remove('hidden');
            try {
                const p = await ApiClient.getCurrentPlayer();
                const name = p.name || p.email;
                document.getElementById('playerWelcome').textContent = 'Signed in as ' + name;
                document.getElementById('playerWelcome').classList.remove('hidden');
            } catch (_) {}
            setWeaponTabs();
            await loadEvents();
            await loadMaterials();
        })();
    </script>
</body>
</html>
